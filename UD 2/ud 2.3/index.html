<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de alta de usuario</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <form action="#" method="POST">
        <table class="mi-formulario">

            <tr>
                <th colspan="2" class="titulo">Formulario de alta de usuario</th>
            </tr>

            <tr>
                <td colspan="2">
                    <label for="id_usu">Identificador de nuevo usuario:</label>
                    <input type="text" id="id_usu" name="id_usu" value="usu_012345" readonly title="Campo de solo lectura">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required title="Introduce tu nombre">
                </td>
                <td>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" required title="Introduce tus apellidos">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="pass">Contraseña:</label>
                    <input type="password" id="pass" name="pass" required title="Introduce tu contraseña">
                </td>
                <td>
                    <label for="c_pass">Confirmar contraseña:</label>
                    <input type="password" id="c_pass" name="c_pass" required title="Repite la contraseña">
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required title="Introduce tu correo electrónico">
                </td>
            </tr>

            <tr>
                <td><label>Sexo:</label></td>
                <td>
                    <label><input type="radio" name="sexo" value="Hombre" title="Hombre"> Hombre</label>
                    <label><input type="radio" name="sexo" value="Mujer" checked title="Mujer"> Mujer</label>
                </td>
            </tr>

            <tr>
                <td><label>Aficiones:</label></td>
                <td>
                    <label><input type="checkbox" name="aficiones" value="Deporte" title="Deporte"> Deportes</label>
                    <label><input type="checkbox" name="aficiones" value="Lectura" checked title="Lectura"> Lectura</label>
                    <label><input type="checkbox" name="aficiones" value="Cine" title="Cine"> Cine</label>
                </td>
            </tr>

            <tr>
                <td><label for="pais">País:</label></td>
                <td>
                    <select id="pais" name="pais" title="Selecciona tu país">
                        <option value="Espana" selected>España</option>
                        <option value="Francia">Francia</option>
                        <option value="Portugal">Portugal</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="foto">Subir su foto:</label></td>
                <td>
                    <input type="file" id="foto" name="foto" title="Sube una imagen">
                </td>
            </tr>

            <tr>
                <td><label for="comentarios">Comentarios personales:</label></td>
                <td>
                    <textarea id="comentarios" name="comentarios" cols="40" rows="5" title="Escribe tus comentarios">Escriba aquí sus comentarios</textarea>
                </td>
            </tr>

            <tr>
                <td>
                    <button type="reset" title="Reiniciar formulario">Resetear</button>
                </td>
                <td>
                    <button type="submit" title="Enviar formulario">Enviar</button>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
