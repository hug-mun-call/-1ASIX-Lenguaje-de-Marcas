<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Estados - UD 2.6</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <form action="#" method="POST">
        <fieldset>
            <legend>Formulario de alta de usuario</legend>

            <div class="campo">
                <label for="id_usuario">Identificador de usuario:</label>
                <input type="text" id="id_usuario" name="id_usuario" value="usu_012345" readonly title="Campo de solo lectura">
            </div>

            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required title="Introduce tu nombre (obligatorio)">
            </div>

            <div class="campo">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" title="Introduce tus apellidos">
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required title="Introduce tu contraseña (obligatoria)">
            </div>

            <div class="campo">
                <label for="confirm_password">Confirmar contraseña:</label>
                <input type="password" id="confirm_password" name="confirm_password" required title="Repite la contraseña">
            </div>

            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required title="Introduce tu correo electrónico (obligatorio)">
            </div>

            <div class="campo">
                <label for="promo">Código promocional:</label>
                <input type="text" id="promo" name="promo" disabled value="DESC_2026" title="Campo desactivado">
            </div>

            <div class="campo">
                <label>Sexo:</label>
                <div class="opciones">
                    <input type="radio" id="sexo_h" name="sexo" value="Hombre">
                    <label for="sexo_h" class="lbl-opcion">Hombre</label>
                    
                    <input type="radio" id="sexo_m" name="sexo" value="Mujer" checked>
                    <label for="sexo_m" class="lbl-opcion">Mujer</label>
                </div>
            </div>

            <div class="campo">
                <label>Aficiones:</label>
                <div class="opciones">
                    <input type="checkbox" id="af_dep" name="aficiones" value="Deporte">
                    <label for="af_dep" class="lbl-opcion">Deportes</label>
                    
                    <input type="checkbox" id="af_lec" name="aficiones" value="Lectura" checked>
                    <label for="af_lec" class="lbl-opcion">Lectura</label>
                    
                    <input type="checkbox" id="af_cine" name="aficiones" value="Cine">
                    <label for="af_cine" class="lbl-opcion">Cine</label>
                </div>
            </div>

            <div class="campo">
                <label for="pais">País:</label>
                <select id="pais" name="pais">
                    <option value="Espana" selected>España</option>
                    <option value="Francia">Francia</option>
                    <option value="Portugal">Portugal</option>
                </select>
            </div>

            <div class="campo">
                <label for="foto">Subir su foto:</label>
                <input type="file" id="foto" name="foto">
            </div>

            <div class="campo">
                <label for="comentarios">Comentarios personales:</label>
                <textarea id="comentarios" name="comentarios" cols="40" rows="5">Escriba aquí sus comentarios</textarea>
            </div>

            <div class="botones">
                <button type="reset">Resetear</button>
                <button type="submit">Enviar</button>
            </div>

        </fieldset>
    </form>

</body>
</html>
